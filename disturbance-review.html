<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nové Hraběcí – ověření vegetačních změn</title><style>:root{color-scheme:dark;--bg:#071117;--p:#0d2028;--line:#1f3a44;--tx:#edf8fb;--mu:#94adb7;--a:#65d8cf;--w:#ffc36b;--r:#ff8b72;--g:#70e2a1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#12303b,#071117 42%,#050b0f);font:15px system-ui;color:var(--tx)}main{max-width:1180px;margin:auto;padding:18px}h1{font-size:clamp(30px,5vw,46px);margin:5px 0}.eye{color:var(--a);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}.muted{color:var(--mu)}.top{display:flex;justify-content:space-between;gap:12px}.back{color:var(--a);text-decoration:none;font-weight:700}.summary{margin:16px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:#0b1c23}.grid{display:grid;gap:14px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#102630,#09171d);padding:14px}.card.confirmed{border-color:#35684b;box-shadow:inset 0 0 0 1px #315d45}.card.nochange{border-color:#3b5660;box-shadow:inset 0 0 0 1px #324851}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.sev,.review{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid var(--line)}.sev.strong{color:#ffd0c7;border-color:#7a3c32;background:#321713}.sev.moderate{color:#ffe2a5;border-color:#675526;background:#2a2514}.review.confirmed{color:#c9f5d8;border-color:#3d7653;background:#122c20;font-weight:800}.review.nochange{color:#c4d4da;border-color:#506b75;background:#122028;font-weight:800}.trip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stage{background:#07151b;border:1px solid var(--line);border-radius:12px;overflow:hidden}.stage img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#050b0f}.cap{padding:8px 9px;font-size:12px}.cap b{display:block}.delta{font-weight:800;color:var(--r)}.note{font-size:12px;color:var(--mu);line-height:1.5;margin-top:8px}@media(max-width:760px){.top{flex-direction:column}.trip{grid-template-columns:1fr}.card{padding:10px}}</style></head><body><main><div class="top"><div><div class="eye">historická kontrola Sentinel-2</div><h1>VEGETAČNÍ ZMĚNY</h1><div class="muted">Před · propad · po · stejné měřítko a stejný RGB stretch</div></div><a class="back" href="./knowledge.html">← co jsme se naučili</a></div><div class="summary" id="summary">Načítám historické výřezy…</div><div class="grid" id="cards"></div></main><script>
const $=id=>document.getElementById(id);const f=(v,d=3)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'–';const names={before:'PŘED',event:'PROPAD',after:'PO'};
function card(e,confirmed,nochange){const yes=confirmed.has(e.label),none=nochange.has(e.label);const stages=(e.stages||[]).map(s=>`<div class="stage"><img loading="lazy" src="./${s.image}?_=${Date.now()}" alt="${e.label} ${s.stage}"><div class="cap"><b>${names[s.stage]||s.stage}</b>${s.date||'–'} · NDVI ${f(s.ndvi)}</div></div>`).join('');return `<section class="card ${yes?'confirmed':none?'nochange':''}"><div class="head"><div><b>${e.label}</b> · ${e.role||'–'}<br><span class="delta">ΔNDVI ${f(e.delta_ndvi,3)}</span></div><div class="badges"><span class="sev ${e.severity||''}">${e.severity||'–'}</span>${yes?'<span class="review confirmed">✓ vizuálně potvrzená změna</span>':none?'<span class="review nochange">≈ bez viditelné změny</span>':''}</div></div><div class="trip">${stages}</div><div class="note">Zelená = změna je na historických snímcích jasně patrná. Šedomodrá = algoritmus zaznamenal NDVI propad, ale ruční kontrola nevidí přesvědčivou změnu. Příčinu změn zatím neurčujeme.</div></section>`}
Promise.all([
 fetch('./data/validation/disturbance-review-manifest.json?_='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),
 fetch('./config/disturbance-visual-review.json?_='+Date.now()).then(r=>r.ok?r.json():({confirmed_change:[],no_visible_change:[]}))
]).then(([d,review])=>{const confirmed=new Set((review.confirmed_change||[]).map(x=>x.label));const nochange=new Set((review.no_visible_change||[]).map(x=>x.label));const ev=[...(d.events||[])].sort((a,b)=>{const rank=x=>confirmed.has(x.label)?0:nochange.has(x.label)?1:2;const ra=rank(a),rb=rank(b);if(ra!==rb)return ra-rb;return (a.severity==='strong'?0:1)-(b.severity==='strong'?0:1)});const unreviewed=Math.max(0,ev.length-confirmed.size-nochange.size);$('summary').innerHTML=`<b>${ev.length}</b> algoritmických kandidátů · <b>${confirmed.size}</b> vizuálně potvrzených změn · <b>${nochange.size}</b> bez viditelné změny · <b>${unreviewed}</b> zatím nevyhodnocených. <span class="muted">Algoritmický NDVI propad není automaticky reálná změna porostu.</span>`;$('cards').innerHTML=ev.map(e=>card(e,confirmed,nochange)).join('')}).catch(e=>$('summary').textContent='Historické výřezy ještě nejsou připravené: '+e.message);
</script></body></html>
