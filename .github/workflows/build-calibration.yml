name: Build NH calibration backfill

on:
  schedule:
    - cron: '43 4 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/calibration_truth.py'
      - 'scripts/backfill_calibration_history.py'
      - 'scripts/build_calibration_shadow.py'
      - 'scripts/build_calibration_ml_shadow.py'
      - 'scripts/build_calibration_ml_walkforward.py'
      - 'scripts/validate_calibration_strict.py'
      - 'scripts/diagnose_calibration_bias.py'
      - 'scripts/build_calibration_observation_challenger.py'
      - 'scripts/build_calibration_per_model_challenger.py'
      - '.github/workflows/build-calibration.yml'

permissions:
  contents: write

concurrency:
  group: meteo-data-writer
  cancel-in-progress: false

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install shadow ML dependency
        run: pip install --disable-pip-version-check scikit-learn
      - name: Backfill multi-season model history against DWD Sohland
        run: python scripts/backfill_calibration_history.py
      - name: Build deterministic shadow calibration benchmark
        run: python scripts/build_calibration_shadow.py
      - name: Build ML v1 shadow calibration benchmark
        run: python scripts/build_calibration_ml_shadow.py
      - name: Build ML v1 walk-forward backtest
        run: python scripts/build_calibration_ml_walkforward.py
      - name: Run strict validation guards
        run: python scripts/validate_calibration_strict.py
      - name: Diagnose model-specific bias variants
        run: python scripts/diagnose_calibration_bias.py
      - name: Test issue-observation challenger
        run: python scripts/build_calibration_observation_challenger.py
      - name: Test separate per-model challenger
        run: python scripts/build_calibration_per_model_challenger.py
      - name: Commit calibration artifacts
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_data() {
            python scripts/backfill_calibration_history.py
            python scripts/build_calibration_shadow.py
            python scripts/build_calibration_ml_shadow.py
            python scripts/build_calibration_ml_walkforward.py
            python scripts/validate_calibration_strict.py
            python scripts/diagnose_calibration_bias.py
            python scripts/build_calibration_observation_challenger.py
            python scripts/build_calibration_per_model_challenger.py
          }

          make_commit() {
            git add data/calibration
            if git diff --cached --quiet; then
              echo "No calibration changes."
              return 1
            fi
            git commit -m "data: calibration backfill $(date -u +'%Y-%m-%d %H:%M UTC')"
          }

          make_commit || exit 0

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Concurrent repository update detected; rebuilding calibration on latest main (attempt ${attempt}/3)."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            rebuild_data
            make_commit || exit 0
            sleep $((attempt * 5))
          done

          echo "Unable to push calibration data after 3 retries."
          exit 1
