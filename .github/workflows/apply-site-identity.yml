name: Apply site identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'favicon.svg'
      - 'manifest.webmanifest'
      - 'scripts/apply_site_identity.py'
      - '.github/workflows/apply-site-identity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add favicon and about link
        run: python scripts/apply_site_identity.py
      - name: Commit patched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No site identity changes."
            exit 0
          fi
          git commit -m "site: add favicon and how-it-works navigation"
          git pull --rebase origin main
          git push
