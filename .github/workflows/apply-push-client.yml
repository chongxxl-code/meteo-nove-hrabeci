name: Apply push client to observatory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_push_client.py'
      - 'push-client.js'
      - '.github/workflows/apply-push-client.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_push_client.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "site: enable critical push opt-in" || exit 0
          git pull --rebase origin main
          git push
