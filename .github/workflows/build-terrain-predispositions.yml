name: Build terrain predispositions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_terrain_predispositions.py'
      - 'scripts/analyze_terrain_cuzk.py'
      - 'config/zones.geojson'
      - '.github/workflows/build-terrain-predispositions.yml'

permissions:
  contents: write

concurrency:
  group: terrain-predispositions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio pillow pyflwdir numba
      - name: Build predisposition layers
        run: python scripts/build_terrain_predispositions.py
      - name: Commit predisposition result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terrain/predisposition || true
          if git diff --cached --quiet; then
            echo "No predisposition changes."
            exit 0
          fi
          git commit -m "data: terrain predispositions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
