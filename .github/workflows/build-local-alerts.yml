name: Build Nové Hraběcí local alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_local_alerts.py'
      - 'scripts/enrich_local_alerts_nowcast.py'
      - 'scripts/enrich_alerts_chmi_radar.py'
      - 'scripts/enrich_alerts_chmi_forecast.py'
      - 'scripts/build_radar_nowcast.py'
      - 'scripts/build_chmi_radar.py'
      - 'scripts/build_chmi_radar_forecast.py'
      - 'scripts/send_critical_push.py'
      - 'scripts/sync_push_config.py'
      - 'scripts/check_onesignal_health.py'
      - '.github/workflows/build-local-alerts.yml'
      - 'data/drought-context.json'
      - 'data/radar-nowcast.json'
      - 'data/chmi-radar.json'
      - 'data/chmi-radar-forecast.json'
      - 'data/push-config.json'
      - 'data/validation/open-land-experiment-2026.json'
      - 'data/observations/**'

permissions:
  contents: write

concurrency:
  group: meteo-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install radar analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow h5py pyproj
      - name: Refresh RainViewer radar nowcast for this alert decision
        run: python scripts/build_radar_nowcast.py
      - name: Refresh official CHMI radar composite
        run: python scripts/build_chmi_radar.py
      - name: Refresh official CHMI COTREC radar forecast
        run: python scripts/build_chmi_radar_forecast.py
      - name: Build deterministic local warning state
        env:
          METEOMATICS_USER: ${{ secrets.METEOMATICS_USER }}
          METEOMATICS_PASSWORD: ${{ secrets.METEOMATICS_PASSWORD }}
        run: python scripts/build_local_alerts.py
      - name: Enrich warnings with live RainViewer radar nowcast
        run: python scripts/enrich_local_alerts_nowcast.py
      - name: Enrich warnings with CHMI measured-radar consensus
        run: python scripts/enrich_alerts_chmi_radar.py
      - name: Compare RainViewer ETA with CHMI COTREC forecast
        run: python scripts/enrich_alerts_chmi_forecast.py
      - name: Sync public OneSignal App ID into client config
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: python scripts/sync_push_config.py
      - name: Check OneSignal API credentials without sending
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/check_onesignal_health.py
      - name: Send critical-only push if a new red alert starts
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python scripts/send_critical_push.py || echo "::warning::Critical push delivery failed; next scheduled run will retry."
      - name: Commit only meaningful alert / radar / push-state changes
        env:
          METEOMATICS_USER: ${{ secrets.METEOMATICS_USER }}
          METEOMATICS_PASSWORD: ${{ secrets.METEOMATICS_PASSWORD }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_state_tmp="$(mktemp)"
          if [ -e data/push-state.json ]; then
            cp data/push-state.json "$push_state_tmp"
          else
            : > "$push_state_tmp"
          fi

          rebuild_data() {
            python scripts/build_radar_nowcast.py
            python scripts/build_chmi_radar.py
            python scripts/build_chmi_radar_forecast.py
            python scripts/build_local_alerts.py
            python scripts/enrich_local_alerts_nowcast.py
            python scripts/enrich_alerts_chmi_radar.py
            python scripts/enrich_alerts_chmi_forecast.py
            python scripts/sync_push_config.py
            python scripts/check_onesignal_health.py

            # Never resend a critical push during a git-conflict retry.
            # Preserve the state written by the already-completed send step.
            if [ -s "$push_state_tmp" ]; then
              cp "$push_state_tmp" data/push-state.json
            fi
          }

          make_commit() {
            for f in data/alerts.json data/radar-nowcast.json data/chmi-radar.json data/chmi-radar-forecast.json data/push-state.json data/push-config.json data/push-health.json; do
              if [ -e "$f" ]; then
                git add "$f"
              fi
            done

            if git diff --cached --quiet; then
              echo "Local risk and radar state unchanged."
              return 1
            fi

            git commit -m "data: local risk state $(date -u +'%Y-%m-%d %H:%M UTC')"
          }

          make_commit || exit 0

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi

            echo "Concurrent repository update detected; rebuilding on latest main (attempt ${attempt}/3)."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            rebuild_data
            make_commit || exit 0
            sleep $((attempt * 5))
          done

          echo "Unable to push local alert data after 3 retries."
          exit 1
# OneSignal health check enabled
