name: Apply local risk UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_alerts_ui.py'
      - '.github/workflows/apply-alerts-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_alerts_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "site: show local risk card"
          git pull --rebase origin main
          git push
