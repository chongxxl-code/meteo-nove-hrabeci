name: Collect weather data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_weather.py'
      - '.github/workflows/collect-weather.yml'

permissions:
  contents: write

concurrency:
  group: weather-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect Nové Hraběcí weather snapshot
        run: python scripts/collect_weather.py
      - name: Commit collected data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: weather snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
