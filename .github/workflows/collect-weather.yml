name: Collect weather data

on:
  schedule:
    - cron: '17 */3 * * *'
    # Proven scheduler host for near-live indoor collection; staggered away from minute 0.
    - cron: '6,14,21,29,36,44,51,59 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_weather.py'
      - 'scripts/collect_indoor_emos.py'
      - 'scripts/build_indoor_thermal_model.py'
      - 'scripts/collect_chmi.py'
      - 'scripts/collect_dwd_sohland.py'
      - 'scripts/build_radar_nowcast.py'
      - 'scripts/archive_radar_observation.py'
      - 'scripts/verify_forecasts.py'
      - 'scripts/calibration_truth.py'
      - 'scripts/build_calibration_shadow.py'
      - 'scripts/build_calibration_ml_shadow.py'
      - 'scripts/build_calibration_observation_challenger.py'
      - 'scripts/build_calibration_prospective.py'
      - 'scripts/build_calibration_pooled_prospective.py'
      - 'scripts/verify_calibration_prospective.py'
      - 'scripts/build_health_status.py'
      - 'scripts/apply_health_ui.py'
      - 'health-ui.js'
      - '.github/workflows/collect-weather.yml'

permissions:
  contents: write

jobs:
  live-indoor:
    concurrency:
      group: meteo-indoor-live
      cancel-in-progress: false
    if: github.event_name == 'schedule' && github.event.schedule == '6,14,21,29,36,44,51,59 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect and commit EMOS indoor live data
        env:
          EMOS_USERNAME: ${{ secrets.EMOS_USERNAME }}
          EMOS_PASSWORD: ${{ secrets.EMOS_PASSWORD }}
          EMOS_APP_ID: ${{ secrets.EMOS_APP_ID }}
          EMOS_APP_SECRET: ${{ secrets.EMOS_APP_SECRET }}
          EMOS_BMP_KEY: ${{ secrets.EMOS_BMP_KEY }}
          EMOS_CERT_SHA256: ${{ secrets.EMOS_CERT_SHA256 }}
          EMOS_LIVE_MODE: '1'
          EMOS_LIVE_HEARTBEAT_MINUTES: '30'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python scripts/collect_indoor_emos.py

            # Avoid status-only timestamp churn in near-live runs.
            git restore data/indoor-history-status.json data/indoor-collector-status.json 2>/dev/null || true
            git add data/indoor-cloud/ data/indoor-history.json data/indoor-latest.json
            if git diff --cached --quiet; then
              echo "No material indoor change; nothing to commit."
              exit 0
            fi

            git commit -m "data: indoor live $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; recollecting from latest main (attempt ${attempt}/3)."
            sleep $((attempt * 3))
          done

          echo "Unable to push indoor live data after 3 retries."
          exit 1

  collect:
    concurrency:
      group: meteo-data-writer
      cancel-in-progress: false
    if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fallback radar dependencies
        run: pip install --disable-pip-version-check numpy pillow
      - name: Ensure health UI is linked
        run: python scripts/apply_health_ui.py
      - name: Collect Nové Hraběcí forecast snapshot
        run: python scripts/collect_weather.py
      - name: Collect EMOS indoor cloud snapshot
        continue-on-error: true
        env:
          EMOS_USERNAME: ${{ secrets.EMOS_USERNAME }}
          EMOS_PASSWORD: ${{ secrets.EMOS_PASSWORD }}
          EMOS_APP_ID: ${{ secrets.EMOS_APP_ID }}
          EMOS_APP_SECRET: ${{ secrets.EMOS_APP_SECRET }}
          EMOS_BMP_KEY: ${{ secrets.EMOS_BMP_KEY }}
          EMOS_CERT_SHA256: ${{ secrets.EMOS_CERT_SHA256 }}
        run: python scripts/collect_indoor_emos.py
      - name: Fallback collect CHMI observations
        run: python scripts/collect_chmi.py
      - name: Fallback collect DWD Sohland observations
        run: python scripts/collect_dwd_sohland.py
      - name: Build indoor thermal learning model
        run: python scripts/build_indoor_thermal_model.py
      - name: Fallback rebuild radar nowcast
        run: python scripts/build_radar_nowcast.py
      - name: Fallback archive radar observation
        run: python scripts/archive_radar_observation.py
      - name: Verify matured forecasts against observations
        run: python scripts/verify_forecasts.py
      - name: Install shadow ML dependency
        continue-on-error: true
        run: pip install --disable-pip-version-check scikit-learn
      - name: Rebuild deterministic shadow calibration benchmark
        run: python scripts/build_calibration_shadow.py
      - name: Build ML v1 shadow calibration benchmark
        run: python scripts/build_calibration_ml_shadow.py
      - name: Log frozen pooled squared-error calibration shadow
        run: python scripts/build_calibration_pooled_prospective.py
      - name: Verify matured prospective calibration shadow
        run: python scripts/verify_calibration_prospective.py
      - name: Build collector health status
        run: python scripts/build_health_status.py
      - name: Commit collected forecast, observations and health data
        env:
          EMOS_USERNAME: ${{ secrets.EMOS_USERNAME }}
          EMOS_PASSWORD: ${{ secrets.EMOS_PASSWORD }}
          EMOS_APP_ID: ${{ secrets.EMOS_APP_ID }}
          EMOS_APP_SECRET: ${{ secrets.EMOS_APP_SECRET }}
          EMOS_BMP_KEY: ${{ secrets.EMOS_BMP_KEY }}
          EMOS_CERT_SHA256: ${{ secrets.EMOS_CERT_SHA256 }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_data() {
            python scripts/apply_health_ui.py
            python scripts/collect_weather.py
            python scripts/collect_indoor_emos.py || true
            python scripts/collect_chmi.py
            python scripts/collect_dwd_sohland.py
            python scripts/build_indoor_thermal_model.py
            python scripts/build_radar_nowcast.py
            python scripts/archive_radar_observation.py
            python scripts/verify_forecasts.py
            python scripts/build_calibration_shadow.py
            python scripts/build_calibration_ml_shadow.py
            python scripts/build_calibration_pooled_prospective.py
            python scripts/verify_calibration_prospective.py
            python scripts/build_health_status.py
          }

          make_commit() {
            git add data/ index.html
            if git diff --cached --quiet; then
              echo "No data changes."
              return 1
            fi
            git commit -m "data: forecast snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          }

          make_commit || exit 0

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi

            echo "Concurrent repository update detected; rebuilding on latest main (attempt ${attempt}/3)."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            rebuild_data
            make_commit || exit 0
            sleep $((attempt * 5))
          done

          echo "Unable to push collected data after 3 retries."
          exit 1
