name: Patch main knowledge link

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_knowledge_link_once.py'
      - '.github/workflows/patch-main-knowledge-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/add_knowledge_link_once.py
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change."
            exit 0
          fi
          git commit -m "Add knowledge page to main observatory navigation"
          git pull --rebase origin main
          git push
