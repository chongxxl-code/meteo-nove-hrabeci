name: Collect WeatherNext 2 shadow

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_weathernext_shadow.py'
      - 'scripts/verify_weathernext_shadow.py'
      - 'tests/test_weathernext_shadow.py'
      - '.github/workflows/collect-weathernext-shadow.yml'

permissions:
  contents: write

concurrency:
  group: meteo-weathernext-shadow-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run WeatherNext shadow unit tests
        run: python -m unittest tests/test_weathernext_shadow.py

      - name: Collect native WeatherNext 2 ensemble
        run: python scripts/collect_weathernext_shadow.py

      - name: Verify matured WeatherNext forecasts
        run: python scripts/verify_weathernext_shadow.py

      - name: Commit WeatherNext shadow data only
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_shadow() {
            python scripts/collect_weathernext_shadow.py
            python scripts/verify_weathernext_shadow.py
          }

          make_commit() {
            git add data/weathernext2-shadow/ data/weathernext2-status.json data/weathernext2-verification.json
            if git diff --cached --quiet; then
              echo "No WeatherNext shadow data changes."
              return 1
            fi
            git commit -m "data: WeatherNext 2 shadow $(date -u +'%Y-%m-%d %H:%M UTC')"
          }

          make_commit || exit 0

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi

            echo "Concurrent repository update detected; rebuilding WeatherNext shadow on latest main (attempt ${attempt}/3)."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            rebuild_shadow
            make_commit || exit 0
            sleep $((attempt * 5))
          done

          echo "Unable to push WeatherNext shadow data after 3 retries."
          exit 1
