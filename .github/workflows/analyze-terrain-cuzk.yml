name: Analyze CUZK DMR4G terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_terrain_cuzk.py'
      - 'config/zones.geojson'
      - '.github/workflows/analyze-terrain-cuzk.yml'

permissions:
  contents: write

concurrency:
  group: cuzk-dmr4g-terrain
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio
      - name: Analyze CUZK DMR4G terrain
        run: python scripts/analyze_terrain_cuzk.py
      - name: Commit terrain result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terrain/terrain-cuzk-status.json
          if git diff --cached --quiet; then
            echo "No CUZK terrain changes."
            exit 0
          fi
          git commit -m "data: CUZK DMR4G terrain $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
