name: Analyze CUZK DMR4G terrain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_terrain_cuzk.py'
      - 'config/zones.geojson'
      - '.github/workflows/analyze-terrain-cuzk.yml'

permissions:
  contents: write

concurrency:
  group: cuzk-dmr4g-terrain
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio
      - name: Analyze CUZK DMR4G terrain
        id: terrain
        continue-on-error: true
        run: python scripts/analyze_terrain_cuzk.py
      - name: Commit terrain result or diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terrain/terrain-cuzk-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No CUZK terrain changes."
            exit 0
          fi
          git commit -m "data: CUZK DMR4G terrain $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
      - name: Verify terrain analysis
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/terrain/terrain-cuzk-status.json')
          if not p.exists():
              raise SystemExit('terrain-cuzk-status.json was not produced')
          s = json.loads(p.read_text(encoding='utf-8'))
          if not s.get('ok'):
              raise SystemExit('CUZK terrain analysis failed: ' + str(s.get('error')))
          print('CUZK DMR4G terrain analysis valid.')
          PY
