name: Generate matched open-land candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_open_land_candidates.py'
      - '.github/workflows/generate-open-land-candidates.yml'

permissions:
  contents: write

concurrency:
  group: open-land-candidates
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio pyflwdir
      - name: Select open-land candidates
        run: python scripts/generate_open_land_candidates.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/open-land-candidates.geojson data/validation/open-land-candidates-status.json
          if git diff --cached --quiet; then
            echo "No candidate changes."
            exit 0
          fi
          git commit -m "data: matched open-land candidate network $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
