name: Analyze terrain (Copernicus DEM)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_terrain.py'
      - 'config/zones.geojson'
      - '.github/workflows/analyze-terrain.yml'

permissions:
  contents: write

concurrency:
  group: terrain-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio
      - name: Compute elevation, slope, aspect and TPI
        run: python scripts/analyze_terrain.py
      - name: Commit terrain analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terrain/terrain-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No terrain-analysis changes."
            exit 0
          fi
          git commit -m "data: terrain analysis $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
