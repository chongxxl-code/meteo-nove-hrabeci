name: Analyze CUZK DMR4G hydrology

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_hydrology_cuzk.py'
      - 'scripts/analyze_terrain_cuzk.py'
      - 'config/zones.geojson'
      - '.github/workflows/analyze-hydrology-cuzk.yml'

permissions:
  contents: write

concurrency:
  group: cuzk-dmr4g-hydrology
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hydrology dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio pyflwdir
      - name: Analyze D8 flow, accumulation and TWI
        id: hydro
        continue-on-error: true
        run: python scripts/analyze_hydrology_cuzk.py
      - name: Commit hydrology result or diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terrain/hydrology-status.json data/terrain/derived-drainage.geojson 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hydrology changes."
            exit 0
          fi
          git commit -m "data: DMR4G hydrology $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
      - name: Verify hydrology analysis
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/terrain/hydrology-status.json')
          if not p.exists():
              raise SystemExit('hydrology-status.json was not produced')
          s = json.loads(p.read_text(encoding='utf-8'))
          if not s.get('ok'):
              raise SystemExit('DMR4G hydrology analysis failed: ' + str(s.get('error')))
          print('DMR4G hydrology analysis valid:', s.get('quality_status'))
          PY
