name: Test WeatherNext 3 Google OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate with Google OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: weathernext-hrabeci
          workload_identity_provider: projects/355976439458/locations/global/workloadIdentityPools/meteo-hrabeci-github/providers/github-actions-meteo
          service_account: meteo-weathernext3@weathernext-hrabeci.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Install minimal clients
        run: python -m pip install --disable-pip-version-check earthengine-api google-auth google-cloud-storage

      - name: Diagnose two independent read paths (no data changes)
        run: |
          python - <<'PY'
          import google.auth
          from google.cloud import storage

          scopes = [
              'https://www.googleapis.com/auth/cloud-platform',
              'https://www.googleapis.com/auth/earthengine.readonly',
          ]
          creds, project = google.auth.default(scopes=scopes)
          print('Authenticated Google project:', project)
          print('Testing Cloud Storage object listing (max one object, no downloads)...', flush=True)
          try:
              client = storage.Client(project='weathernext-hrabeci', credentials=creds)
              items = client.list_blobs(
                  'weathernext3_statistics_spatial',
                  prefix='weathernext_3_0_0_statistics/zarr/2026_to_present/20261101_13hr_01_preds/',
                  max_results=1,
                  timeout=20,
              )
              first = next(iter(items), None)
              print('GCS_LIST_OK:', first.name if first else '(empty)', flush=True)
          except Exception as exc:
              print('GCS_LIST_ERROR:', type(exc).__name__, str(exc)[:500], flush=True)

          print('Testing Earth Engine collection visibility...', flush=True)
          try:
              import ee
              ee.Initialize(credentials=creds, project='weathernext-hrabeci')
              col = ee.ImageCollection(
                  'projects/gcp-public-data-weathernext/assets/weathernext_3_0_0_0p05deg'
              ).filter(ee.Filter.eq('start_time', '2026-11-01T13:00:00Z'))
              print('EE_COLLECTION_COUNT:', col.limit(1).size().getInfo(), flush=True)
          except Exception as exc:
              print('EE_READ_ERROR:', type(exc).__name__, str(exc)[:500], flush=True)
          PY
