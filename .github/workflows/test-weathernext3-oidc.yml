name: Test WeatherNext 3 Google OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: weathernext-hrabeci
          workload_identity_provider: projects/355976439458/locations/global/workloadIdentityPools/meteo-hrabeci-github/providers/github-actions-meteo
          service_account: meteo-weathernext3@weathernext-hrabeci.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Earth Engine client
        run: python -m pip install --disable-pip-version-check earthengine-api google-auth

      - name: Read one WeatherNext 3 point via Earth Engine
        env:
          CLOUD_PROJECT_ID: weathernext-hrabeci
        run: |
          python - <<'PY'
          import ee
          import google.auth

          creds, _ = google.auth.default(
              scopes=['https://www.googleapis.com/auth/cloud-platform']
          )
          ee.Initialize(credentials=creds, project='weathernext-hrabeci')

          collection = (
              ee.ImageCollection(
                  'projects/gcp-public-data-weathernext/assets/weathernext_3_0_0_0p05deg'
              )
              .filter(ee.Filter.eq('start_time', '2026-11-01T13:00:00Z'))
              .filter(ee.Filter.eq('forecast_hour', 6))
          )
          count = collection.size().getInfo()
          if count != 1:
              raise RuntimeError(f'Expected one known WeatherNext 3 forecast, got {count}')

          point = ee.Geometry.Point([14.424857, 51.016900])
          data = (
              ee.Image(collection.first())
              .select('station_head_temperature_2m_mean')
              .subtract(273.15)
              .reduceRegion(
                  reducer=ee.Reducer.first(),
                  geometry=point,
                  scale=5000,
                  maxPixels=100,
              )
              .getInfo()
          )
          temp = data.get('station_head_temperature_2m_mean')
          if temp is None:
              raise RuntimeError('WeatherNext 3 temperature not returned')
          print(f'EE point read OK; Nové Hraběcí +6h: {temp:.2f} C')
          PY
