name: Analyze manually verified vegetation-change sensitivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_open_land_manual_sensitivity.py'
      - 'config/disturbance-visual-review.json'
      - 'data/validation/open-land-disturbance-2026.json'
      - 'data/validation/open-land-experiment-2026.json'
      - '.github/workflows/analyze-open-land-manual-sensitivity.yml'

permissions:
  contents: write

concurrency:
  group: manual-disturbance-sensitivity
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Run manual-review sensitivity analysis
        run: python scripts/analyze_open_land_manual_sensitivity.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/open-land-manual-sensitivity-2026.json data/validation/open-land-manual-sensitivity-status.json
          if git diff --cached --quiet; then
            echo "No manual sensitivity changes."
            exit 0
          fi
          git commit -m "data: manual disturbance sensitivity $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
