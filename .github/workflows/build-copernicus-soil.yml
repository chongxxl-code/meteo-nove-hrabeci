name: Build Copernicus soil moisture context

on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build_copernicus_soil_context.py'
      - '.github/workflows/build-copernicus-soil.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install soil raster dependencies
        run: python -m pip install --disable-pip-version-check boto3 rasterio
      - name: Build Copernicus soil context
        env:
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: python scripts/build_copernicus_soil_context.py
      - name: Commit context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/copernicus-soil.json
          git commit -m "data: Copernicus soil context $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 0
          git pull --rebase origin main
          git push
# trigger immediate first build
