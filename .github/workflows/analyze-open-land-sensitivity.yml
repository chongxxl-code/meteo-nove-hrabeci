name: Analyze open-land disturbance sensitivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_open_land_sensitivity.py'
      - 'data/validation/open-land-disturbance-2026.json'
      - 'data/validation/open-land-gradient-status.json'
      - '.github/workflows/analyze-open-land-sensitivity.yml'
  schedule:
    - cron: '53 8 * * 1'

permissions:
  contents: write

concurrency:
  group: open-land-disturbance-sensitivity
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run disturbance-filtered sensitivity analysis
        run: python scripts/analyze_open_land_sensitivity.py
      - name: Commit sensitivity result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/open-land-sensitivity-2026.json data/validation/open-land-sensitivity-status.json
          if git diff --cached --quiet; then
            echo "No sensitivity changes."
            exit 0
          fi
          git commit -m "data: open-land disturbance sensitivity $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
