name: Generate north-facing open-land candidates v4

# Immediate v4 run after workflow creation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_north_candidates_v4.py'
      - '.github/workflows/generate-north-candidates-v4.yml'
      - 'config/open-land-experimental.geojson'
      - 'config/open-land-target-candidates-v3.geojson'

permissions:
  contents: write

concurrency:
  group: north-open-candidates-v4
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio pyflwdir
      - name: Generate north-facing candidates
        run: python scripts/generate_north_candidates_v4.py
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/open-land-north-candidates-v4.geojson data/validation/open-land-north-candidates-v4-status.json
          if git diff --cached --quiet; then
            echo "No north candidate changes."
            exit 0
          fi
          git commit -m "data: north-facing open-land candidates v4 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
