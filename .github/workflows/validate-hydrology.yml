name: Validate D8 hydrology against ZABAGED

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/validate_hydrology.py'
      - 'data/terrain/derived-drainage.geojson'
      - 'data/terrain/zabaged-watercourses.geojson'
      - '.github/workflows/validate-hydrology.yml'

permissions:
  contents: write

concurrency:
  group: validate-hydrology
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check shapely pyproj
      - name: Validate D8 against official ZABAGED watercourses
        id: validate
        continue-on-error: true
        run: python scripts/validate_hydrology.py
      - name: Commit validation or diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/terrain/hydrology-validation.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No validation changes."
            exit 0
          fi
          git commit -m "data: validate DMR4G hydrology $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
      - name: Verify validation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/terrain/hydrology-validation.json')
          if not p.exists(): raise SystemExit('hydrology-validation.json missing')
          s=json.loads(p.read_text(encoding='utf-8'))
          if not s.get('ok'): raise SystemExit('Hydrology validation failed: '+str(s.get('error')))
          print('Hydrology validation complete.')
          PY
