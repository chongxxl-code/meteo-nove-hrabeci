name: Analyze reviewed open-land experiment

# Re-run after the stable experimental network expanded to 17 reviewed samples.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/open-land-experimental.geojson'
      - 'scripts/analyze_open_land_experiment.py'
      - '.github/workflows/analyze-open-land-experiment.yml'
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: write

concurrency:
  group: reviewed-open-land-experiment
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio
      - name: Analyze seasonal open-land response
        run: python scripts/analyze_open_land_experiment.py
      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/open-land-experiment-2026.json data/validation/open-land-experiment-status.json
          if git diff --cached --quiet; then
            echo "No experiment changes."
            exit 0
          fi
          git commit -m "data: reviewed open-land Sentinel experiment $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
