name: Collect regional weather observations

# ČHMÚ and DWD 10-minute observations are refreshed frequently; collect hourly.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_chmi.py'
      - 'scripts/collect_dwd_sohland.py'
      - 'scripts/verify_forecasts.py'
      - '.github/workflows/collect-chmi.yml'

permissions:
  contents: write

concurrency:
  group: regional-weather-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect live CHMI 10-minute observations
        run: python scripts/collect_chmi.py
      - name: Collect live DWD Sohland 10-minute observations
        run: python scripts/collect_dwd_sohland.py
      - name: Rebuild forecast verification
        run: python scripts/verify_forecasts.py
      - name: Commit observations and verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chmi-status.json data/dwd-sohland-status.json data/observations/ data/forecast-verification.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No observation changes."
            exit 0
          fi
          git commit -m "data: regional weather $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
