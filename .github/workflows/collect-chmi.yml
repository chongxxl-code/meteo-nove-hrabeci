name: Collect regional weather observations

# ČHMÚ and DWD 10-minute observations are refreshed frequently; collect hourly.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_chmi.py'
      - 'scripts/collect_dwd_sohland.py'
      - 'scripts/verify_forecasts.py'
      - 'scripts/build_health_status.py'
      - '.github/workflows/collect-chmi.yml'

permissions:
  contents: write

concurrency:
  group: meteo-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect live CHMI 10-minute observations
        run: python scripts/collect_chmi.py
      - name: Collect live DWD Sohland 10-minute observations
        run: python scripts/collect_dwd_sohland.py
      - name: Rebuild forecast verification
        run: python scripts/verify_forecasts.py
      - name: Build collector health status
        run: python scripts/build_health_status.py
      - name: Commit observations, verification and health
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_data() {
            python scripts/collect_chmi.py
            python scripts/collect_dwd_sohland.py
            python scripts/verify_forecasts.py
            python scripts/build_health_status.py
          }

          make_commit() {
            git add data/chmi-status.json data/dwd-sohland-status.json data/health-status.json data/observations/ data/forecast-verification.json 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No observation changes."
              return 1
            fi
            git commit -m "data: regional weather $(date -u +'%Y-%m-%d %H:%M UTC')"
          }

          make_commit || exit 0

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi

            echo "Concurrent repository update detected; rebuilding on latest main (attempt ${attempt}/3)."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            rebuild_data
            make_commit || exit 0
            sleep $((attempt * 5))
          done

          echo "Unable to push regional observations after 3 retries."
          exit 1
