name: Collect EMOS indoor live

on:
  schedule:
    # Keep one long-lived session for ~5.5 h. Trigger a replacement every hour
    # so one fresh run is normally already pending when the active session ends.
    # The concurrency group below still allows only one active EMOS session.
    # New hourly triggers replace the older pending run instead of creating
    # parallel logins; cloud-history overlap backfills any remaining short gap.
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_indoor_emos.py'
      - '.github/workflows/collect-indoor-live.yml'

permissions:
  contents: write

concurrency:
  group: meteo-indoor-live-session
  cancel-in-progress: false

jobs:
  collect-indoor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect EMOS indoor every 7 minutes
        env:
          EMOS_USERNAME: ${{ secrets.EMOS_USERNAME }}
          EMOS_PASSWORD: ${{ secrets.EMOS_PASSWORD }}
          EMOS_APP_ID: ${{ secrets.EMOS_APP_ID }}
          EMOS_APP_SECRET: ${{ secrets.EMOS_APP_SECRET }}
          EMOS_BMP_KEY: ${{ secrets.EMOS_BMP_KEY }}
          EMOS_CERT_SHA256: ${{ secrets.EMOS_CERT_SHA256 }}
          EMOS_LIVE_MODE: '1'
          EMOS_LIVE_HEARTBEAT_MINUTES: '30'
          EMOS_SESSION_FILE: ${{ runner.temp }}/emos-session.sid
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_with_backoff() {
            local push_attempt push_output push_rc delay
            for push_attempt in 1 2 3 4 5 6; do
              set +e
              push_output="$(git push origin HEAD:main 2>&1)"
              push_rc=$?
              set -e
              printf '%s\n' "${push_output}"

              if [ "${push_rc}" -eq 0 ]; then
                return 0
              fi

              # GitHub occasionally rejects an otherwise valid push with a transient
              # server/transport failure. Retry the SAME prepared commit so we do not
              # reopen EMOS or rebuild data merely because GitHub returned a 5xx.
              if printf '%s\n' "${push_output}" | grep -Eqi 'Internal Server Error|HTTP (500|502|503|504)|remote end hung up|RPC failed|connection reset|temporarily unavailable|TLS.*terminated'; then
                if [ "${push_attempt}" -ge 6 ]; then
                  echo "GitHub push still failing after 6 transient-error retries."
                  return 88
                fi
                case "${push_attempt}" in
                  1) delay=10 ;;
                  2) delay=20 ;;
                  3) delay=40 ;;
                  4) delay=60 ;;
                  *) delay=90 ;;
                esac
                echo "Transient GitHub push failure; retrying the same commit in ${delay}s (attempt ${push_attempt}/6)."
                sleep "${delay}"
                continue
              fi

              # A non-transient rejection is most commonly a moved main/non-fast-forward.
              # Let collect_once refresh from origin/main and regenerate against it.
              return 2
            done
            return 88
          }

          collect_once() {
            local cycle_num="${1:-1}"
            for attempt in 1 2 3; do
              # Always recollect from newest main. Other collectors may commit while
              # this live session is sleeping.
              git fetch origin main
              git reset --hard origin/main

              set +e
              python scripts/collect_indoor_emos.py
              rc=$?
              set -e
              if [ "${rc}" -eq 75 ]; then
                return 75
              fi
              if [ "${rc}" -ne 0 ]; then
                return "${rc}"
              fi

              # Refresh the passive thermal model roughly every 42 minutes and
              # immediately on the first cycle of every replacement session.
              # This is local computation only; it does not open another EMOS session.
              if [ $(( (cycle_num - 1) % 6 )) -eq 0 ]; then
                python scripts/build_indoor_thermal_model.py
              fi

              # Keep the compact collector status current; history-status is verbose
              # and is not needed on every seven-minute live commit.
              git restore data/indoor-history-status.json 2>/dev/null || true
              git add data/indoor-cloud/ data/indoor-history.json data/indoor-latest.json data/indoor-collector-status.json data/indoor-dp-diagnostic.json data/indoor-thermal-model.json

              if git diff --cached --quiet; then
                echo "No material indoor change."
                return 0
              fi

              git commit -m "data: indoor live $(date -u +'%Y-%m-%d %H:%M UTC')"

              set +e
              push_with_backoff
              push_rc=$?
              set -e
              if [ "${push_rc}" -eq 0 ]; then
                return 0
              fi
              if [ "${push_rc}" -eq 88 ]; then
                echo "Unable to push indoor live data because GitHub server/transport errors persisted."
                return 1
              fi

              echo "Main moved while publishing indoor data; recollecting from latest main (attempt ${attempt}/3)."
              sleep $((attempt * 3))
            done

            echo "Unable to push indoor live data after 3 main-refresh attempts."
            return 1
          }

          # 48 cycles keep one authenticated session alive for roughly 5.5 hours.
          # A session-limit response stops this job immediately instead of hammering login.
          for cycle in $(seq 1 48); do
            echo "Indoor live cycle ${cycle}/48"
            set +e
            collect_once "${cycle}"
            rc=$?
            set -e
            if [ "${rc}" -eq 75 ]; then
              echo "EMOS session limit reached; stop this session and wait for the next scheduled window."
              break
            fi
            if [ "${rc}" -ne 0 ]; then
              exit "${rc}"
            fi
            if [ "${cycle}" -lt 48 ]; then
              sleep 420
            fi
          done
