name: Collect EMOS indoor live

on:
  schedule:
    # GitHub cron is too irregular for direct 7-minute polling.
    # Start/queue a long-lived session hourly; the session polls every 7 minutes.
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_indoor_emos.py'
      - '.github/workflows/collect-indoor-live.yml'

permissions:
  contents: write

concurrency:
  group: meteo-indoor-live-session
  cancel-in-progress: false

jobs:
  collect-indoor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect EMOS indoor every 7 minutes
        env:
          EMOS_USERNAME: ${{ secrets.EMOS_USERNAME }}
          EMOS_PASSWORD: ${{ secrets.EMOS_PASSWORD }}
          EMOS_APP_ID: ${{ secrets.EMOS_APP_ID }}
          EMOS_APP_SECRET: ${{ secrets.EMOS_APP_SECRET }}
          EMOS_BMP_KEY: ${{ secrets.EMOS_BMP_KEY }}
          EMOS_CERT_SHA256: ${{ secrets.EMOS_CERT_SHA256 }}
          EMOS_LIVE_MODE: '1'
          EMOS_LIVE_HEARTBEAT_MINUTES: '30'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          collect_once() {
            for attempt in 1 2 3; do
              # Always recollect from newest main. Other collectors may commit while
              # this live session is sleeping.
              git fetch origin main
              git reset --hard origin/main

              python scripts/collect_indoor_emos.py

              # Do not create commits for status-only timestamp churn.
              git restore data/indoor-history-status.json data/indoor-collector-status.json 2>/dev/null || true
              git add data/indoor-cloud/ data/indoor-history.json data/indoor-latest.json

              if git diff --cached --quiet; then
                echo "No material indoor change."
                return 0
              fi

              git commit -m "data: indoor live $(date -u +'%Y-%m-%d %H:%M UTC')"
              if git push origin HEAD:main; then
                return 0
              fi

              echo "Concurrent main update; recollecting from latest main (attempt ${attempt}/3)."
              sleep $((attempt * 3))
            done

            echo "Unable to push indoor live data after 3 retries."
            return 1
          }

          # 48 cycles keep one session alive for roughly 5.5 hours. GitHub may delay
          # scheduled starts by hours, so the long-lived session bridges those gaps.
          for cycle in $(seq 1 48); do
            echo "Indoor live cycle ${cycle}/48"
            collect_once
            if [ "${cycle}" -lt 48 ]; then
              sleep 420
            fi
          done
