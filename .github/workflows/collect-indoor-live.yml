name: Collect EMOS indoor live

on:
  schedule:
    # Explicit off-peak minutes: 7-8 minute cadence without minute 0 scheduler load.
    - cron: '6,14,21,29,36,44,51,59 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_indoor_emos.py'
      - '.github/workflows/collect-indoor-live.yml'

permissions:
  contents: write

concurrency:
  group: meteo-data-writer
  cancel-in-progress: false

jobs:
  collect-indoor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect and commit EMOS indoor live data
        env:
          EMOS_USERNAME: ${{ secrets.EMOS_USERNAME }}
          EMOS_PASSWORD: ${{ secrets.EMOS_PASSWORD }}
          EMOS_APP_ID: ${{ secrets.EMOS_APP_ID }}
          EMOS_APP_SECRET: ${{ secrets.EMOS_APP_SECRET }}
          EMOS_BMP_KEY: ${{ secrets.EMOS_BMP_KEY }}
          EMOS_CERT_SHA256: ${{ secrets.EMOS_CERT_SHA256 }}
          EMOS_LIVE_MODE: '1'
          EMOS_LIVE_HEARTBEAT_MINUTES: '30'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Scheduled runs can wait behind the 3-hour writer. Always recollect from
            # the newest main after the concurrency queue instead of rebasing stale data.
            git fetch origin main
            git reset --hard origin/main

            python scripts/collect_indoor_emos.py

            # Live runs intentionally do not commit status-only timestamp churn.
            git restore data/indoor-history-status.json data/indoor-collector-status.json 2>/dev/null || true
            git add data/indoor-cloud/ data/indoor-history.json data/indoor-latest.json
            if git diff --cached --quiet; then
              echo "No material indoor change; nothing to commit."
              exit 0
            fi

            git commit -m "data: indoor live $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent main update detected; recollecting from latest main (attempt ${attempt}/3)."
            sleep $((attempt * 3))
          done

          echo "Unable to push indoor live data after 3 retries."
          exit 1
