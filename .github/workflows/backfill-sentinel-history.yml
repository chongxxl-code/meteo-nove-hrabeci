name: Build seasonal Sentinel landscape history

on:
  workflow_dispatch:
  schedule:
    - cron: '43 12 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_sentinel_history.py'
      - 'scripts/build_sentinel_rain_context.py'
      - 'scripts/analyze_landscape_response.py'
      - 'scripts/analyze_sentinel_zones.py'
      - 'scripts/collect_chmi.py'
      - 'config/zones.geojson'
      - 'data/terrain/predisposition/layers.json'
      - '.github/workflows/backfill-sentinel-history.yml'

permissions:
  contents: write

concurrency:
  group: sentinel-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio
      - name: Build seasonal Sentinel history
        run: python scripts/backfill_sentinel_history.py
      - name: Add antecedent CHMI rainfall context
        run: python scripts/build_sentinel_rain_context.py
      - name: Analyze terrain versus landscape response
        run: python scripts/analyze_landscape_response.py
      - name: Commit seasonal validation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sentinel/history-v3-*.jsonl data/sentinel/history-status.json data/validation/sentinel-rain-context-*.json data/validation/landscape-response-*.json
          if git diff --cached --quiet; then
            echo "No seasonal validation changes."
            exit 0
          fi
          git commit -m "data: Sentinel terrain-response validation $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
