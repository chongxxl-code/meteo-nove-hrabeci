name: Build seasonal Sentinel landscape history

on:
  workflow_dispatch:
  schedule:
    - cron: '43 12 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_sentinel_history.py'
      - 'scripts/analyze_sentinel_zones.py'
      - 'config/zones.geojson'
      - '.github/workflows/backfill-sentinel-history.yml'

permissions:
  contents: write

concurrency:
  group: sentinel-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy rasterio
      - name: Build seasonal Sentinel history
        run: python scripts/backfill_sentinel_history.py
      - name: Commit seasonal history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sentinel/history-v3-*.jsonl data/sentinel/history-status.json
          if git diff --cached --quiet; then
            echo "No Sentinel history changes."
            exit 0
          fi
          git commit -m "data: seasonal Sentinel landscape history $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
