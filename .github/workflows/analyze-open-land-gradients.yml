name: Analyze open-land terrain gradients

# Lightweight within-scene analysis over the current 17-sample reviewed Sentinel experiment.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/analyze_open_land_gradients.py'
      - 'scripts/build_landscape_findings.py'
      - 'config/open-land-experimental.geojson'
      - 'data/validation/open-land-experiment-2026.json'
      - '.github/workflows/analyze-open-land-gradients.yml'
  schedule:
    - cron: '29 8 * * 1'

permissions:
  contents: write

concurrency:
  group: open-land-terrain-gradients
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Analyze within-scene terrain gradients
        run: python scripts/analyze_open_land_gradients.py
      - name: Build living findings
        run: python scripts/build_landscape_findings.py
      - name: Commit gradient analysis and findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validation/open-land-gradient-2026.json data/validation/open-land-gradient-status.json data/knowledge/findings.json
          if git diff --cached --quiet; then
            echo "No gradient/knowledge changes."
            exit 0
          fi
          git commit -m "data: terrain gradients and landscape findings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
